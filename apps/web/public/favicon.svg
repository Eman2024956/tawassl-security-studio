<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Circuit Trace Lines -->
  <path d="M 80 160 H 160 L 210 210" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
  <circle cx="80" cy="160" r="8" fill="#06b6d4" />

  <path d="M 432 160 H 352 L 302 210" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6" fill="none" />
  <circle cx="432" cy="160" r="8" fill="#10b981" />

  <path d="M 120 380 H 180 L 220 340" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" fill="none" />
  <circle cx="120" cy="380" r="7" fill="#06b6d4" />

  <path d="M 392 380 H 332 L 292 340" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" fill="none" />
  <circle cx="392" cy="380" r="7" fill="#10b981" />

  <!-- Outer Cyber Shield -->
  <path d="M 256 80 L 384 136 C 384 272 256 392 256 424 C 256 392 128 272 128 136 Z" 
        fill="url(#innerGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Core Shield -->
  <path d="M 256 128 L 344 172 C 344 268 256 352 256 376 C 256 352 168 268 168 172 Z" 
        fill="#05131f" 
        stroke="#22d3ee" 
        stroke-width="6" 
        stroke-linejoin="round" 
        stroke-opacity="0.8" />

  <!-- Central Keyhole / Cyber Core -->
  <circle cx="256" cy="226" r="26" fill="#10b981" />
  <path d="M 244 236 L 238 290 H 274 L 268 236 Z" fill="#10b981" />
  <circle cx="256" cy="226" r="12" fill="#030712" />

  <!-- Pulse Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.3" />
</svg>
