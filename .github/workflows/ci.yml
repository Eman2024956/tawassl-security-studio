name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.12+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" "pydantic>=2.0" pydantic-settings aiosqlite httpx pytest pytest-asyncio python-multipart google-genai openai

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest apps/backend/tests -v

  frontend-build:
    name: Frontend Build (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Build Next.js Web App
        working-directory: ./apps/web
        run: npm run build
